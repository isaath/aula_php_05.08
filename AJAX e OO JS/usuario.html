            }

            //gets e sets
            this.getSenha = function(){

            }
            this.setSenha = function(senha){
                this.senha = senha;
            }
            function contemMaiusculaEMinuscula(senha) {
                const temMaiuscula = /[A-Z]/.test(senha);
                const temMinuscula = /[a-z]/.test(senha);
                return temMaiuscula && temMinuscula;
            }
            this.setSenha = function (senha) {
                if (contemMaiusculaEMinuscula() == true) {
                    this.senha = senha;
                }
            };




            this.getData_nasc = function(){
                return data_nasc;
            }
            this.setData_nasc = function(data_nasc){
                this.data_nasc = data_nasc;
            }

            function calcularIdade(data_nasc) {
                const hoje = new Date();
                //adiciona o fuso horário para evitar discrepância de data
                const nascimento = new Date(data_nasc + 'T00:00:00'); 
    
                let idade = hoje.getFullYear() - nascimento.getFullYear();
                const mes = hoje.getMonth() - nascimento.getMonth();

                //se ainda não chegou no mês de aniversário, ou se está no mês mas o dia ainda não chegou:
                if (mes < 0 || (mes === 0 && hoje.getDate() < nascimento.getDate())) {
                    idade--;
                }

                return idade;
            }
